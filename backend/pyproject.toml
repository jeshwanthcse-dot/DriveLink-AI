[project]
name = "drivelink-ai-backend"
version = "0.1.0"
description = "DriveLink AI — FastAPI backend for driver exchange and logistics marketplace"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
